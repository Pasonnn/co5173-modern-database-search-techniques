<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CO5173 — Storage Engine Duality: Cassandra vs Elasticsearch</title>
  <!-- KaTeX Progressive Enhancement -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]});"></script>
  <style>
    /* Reset & Base - Academic Light Theme */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    em { font-style: italic; color: #0284C7; }
    sup { font-size: 0.8em; vertical-align: super; line-height: 0; }
    sub { font-size: 0.8em; vertical-align: sub; line-height: 0; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    /* Top Navigation Header */
    header {
      height: 52px;
      background: #FFFFFF;
      border-bottom: 1.5px solid #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13.5px;
      font-weight: 700;
      color: #334155;
    }
    .brand-badge {
      background: #0284C7;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .nav-tools {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .slide-select {
      background: #FFFFFF;
      color: #0F172A;
      border: 1.5px solid #CBD5E1;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      max-width: 320px;
      transition: border-color 0.15s ease;
    }
    .slide-select:focus {
      border-color: #0284C7;
    }
    .btn {
      background: #FFFFFF;
      color: #1E293B;
      border: 1.5px solid #CBD5E1;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: #F1F5F9;
      border-color: #94A3B8;
    }
    .btn.active {
      background: #0284C7;
      border-color: #0284C7;
      color: #FFFFFF;
    }

    /* Timer Chip */
    .timer-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      background: #F0FDF4;
      color: #15803D;
      border: 1.5px solid #BBF7D0;
      cursor: pointer;
      user-select: none;
    }
    .timer-badge.warning {
      background: #FEFCE8;
      color: #A16207;
      border-color: #FEF08A;
    }
    .timer-badge.danger {
      background: #FFF1F2;
      color: #BE123C;
      border-color: #FECDD3;
    }

    /* Slide Stage */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 14px 36px;
      max-width: 1360px;
      margin: 0 auto;
      width: 100%;
      overflow-y: auto;
    }
    .slide-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    .sec-tag {
      font-size: 11px;
      font-weight: 800;
      color: #0284C7;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .badge-tag {
      background: #F1F5F9;
      color: #475569;
      border: 1px solid #E2E8F0;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .slide-title {
      font-size: 26px;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }
    .slide-sub {
      font-size: 14px;
      color: #475569;
      margin-top: 3px;
      margin-bottom: 12px;
      font-weight: 500;
    }

    /* Visual Content Container */
    .slide-visual-stage {
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      border-radius: 12px;
      padding: 18px 22px;
      box-shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.05);
      min-height: 300px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Diagram Placeholder Box */
    .diagram-placeholder {
      background: #F8FAFC;
      border: 2px dashed #0284C7;
      border-radius: 8px;
      padding: 14px 16px;
      position: relative;
    }
    .diagram-placeholder.crimson-border {
      border-color: #E11D48;
    }
    .diagram-placeholder.teal-border {
      border-color: #0D9488;
    }
    .diagram-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #E0F2FE;
      color: #0369A1;
      border: 1px solid #BAE6FD;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .diagram-badge.crimson {
      background: #FFE4E6;
      color: #BE123C;
      border-color: #FECDD3;
    }
    .diagram-badge.teal {
      background: #CCFBF1;
      color: #0F766E;
      border-color: #99F6E4;
    }

    /* Hero Metric Callout */
    .hero-metric-callout {
      background: #F8FAFC;
      border: 1.5px solid #E2E8F0;
      border-radius: 8px;
      padding: 12px 16px;
      text-align: center;
      margin-bottom: 12px;
    }
    .hero-metric-val {
      font-size: 34px;
      font-weight: 900;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }
    .hero-metric-val.blue { color: #0284C7; }
    .hero-metric-val.teal { color: #0D9488; }
    .hero-metric-val.crimson { color: #E11D48; }
    .hero-metric-val.emerald { color: #059669; }
    .hero-metric-sub {
      font-size: 11.5px;
      font-weight: 700;
      color: #64748B;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 3px;
    }

    /* Key Points Section */
    .key-points-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .point-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-left: 3.5px solid #0284C7;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      color: #334155;
      line-height: 1.45;
      font-weight: 500;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }
    .point-card.crimson { border-left-color: #E11D48; }
    .point-card.teal { border-left-color: #0D9488; }

    /* Layout & Component Helpers */
    .split-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: stretch;
    }
    .split-left-wide {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 16px;
      align-items: stretch;
    }
    .split-right-wide {
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      gap: 16px;
      align-items: stretch;
    }
    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #F1F5F9;
      border: 1px solid #CBD5E1;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      color: #1E293B;
    }
    .tag-pill.crimson {
      background: #FFF1F2;
      border-color: #FECDD3;
      color: #9F1239;
    }
    .tag-pill.blue {
      background: #F0F9FF;
      border-color: #BAE6FD;
      color: #0369A1;
    }
    .tag-pill.teal {
      background: #F0FDFA;
      border-color: #99F6E4;
      color: #0F766E;
    }
    .tag-pill.emerald {
      background: #ECFDF5;
      border-color: #A7F3D0;
      color: #047857;
    }
    .table-academic {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: left;
    }
    .table-academic th {
      background: #F1F5F9;
      color: #0F172A;
      font-weight: 800;
      padding: 8px 10px;
      border: 1px solid #CBD5E1;
      letter-spacing: 0.3px;
    }
    .table-academic td {
      padding: 8px 10px;
      border: 1px solid #CBD5E1;
      color: #1E293B;
    }
    .table-academic tr:nth-child(even) {
      background: #F8FAFC;
    }
    .code-snippet-box {
      background: #0F172A;
      color: #F8FAFC;
      border-radius: 8px;
      padding: 12px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
      border: 1px solid #334155;
    }

    /* Footer & Speaker Notes Drawer */
    footer {
      background: #FFFFFF;
      border-top: 1.5px solid #E2E8F0;
      padding: 8px 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 100;
      box-shadow: 0 -1px 3px rgba(15, 23, 42, 0.03);
    }
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .speaker-drawer {
      background: #F8FAFC;
      border: 1.5px solid #CBD5E1;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.55;
      display: none;
      max-height: 140px;
      overflow-y: auto;
    }
    .speaker-drawer.visible {
      display: block;
    }
    .notes-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
      border-bottom: 1px solid #E2E8F0;
      padding-bottom: 4px;
    }
    .note-tab {
      font-size: 11px;
      font-weight: 700;
      color: #64748B;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 4px;
      transition: all 0.15s ease;
    }
    .note-tab:hover {
      color: #0F172A;
      background: #E2E8F0;
    }
    .note-tab.active {
      background: #0284C7;
      color: #FFFFFF;
    }

    /* Tag pills */
    .tag-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      background: #F1F5F9;
      color: #1E293B;
      border: 1px solid #CBD5E1;
    }
    .tag-badge.crimson {
      background: #FFF1F2;
      color: #BE123C;
      border-color: #FECDD3;
    }
    .tag-badge.blue {
      background: #F0F9FF;
      color: #0369A1;
      border-color: #BAE6FD;
    }
    .tag-badge.teal {
      background: #F0FDFA;
      color: #0F766E;
      border-color: #99F6E4;
    }
    .tag-badge.amber {
      background: #FEFCE8;
      color: #A16207;
      border-color: #FEF08A;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="brand">
      <span class="brand-badge">CO5173</span>
      <span>Storage Engine Duality: Cassandra vs Elasticsearch</span>
    </div>
    <div class="nav-tools">
      <select id="slideSelect" class="slide-select" onchange="jumpToSlide(this.value)">
      </select>
      <div id="timerDisplay" class="timer-badge" onclick="toggleTimer()" title="Click to pause/resume timer">
        ⏱️ 00:00 / 15:00
      </div>
      <button class="btn" onclick="toggleNotes()" id="notesBtn" title="Toggle Speaker Notes [S]">
        📝 Notes
      </button>
      <button class="btn" onclick="toggleLanguage()" id="langBtn" title="Toggle Language [L]">
        🌐 EN
      </button>
      <button class="btn" onclick="toggleFullscreen()" title="Fullscreen [F]">
        ⛶
      </button>
    </div>
  </header>

  <!-- Slide Stage -->
  <main id="slideStage">
    <!-- Rendered dynamically -->
  </main>

  <!-- Footer Navigation & Speaker Drawer -->
  <footer>
    <div class="footer-bar">
      <div style="font-size: 12.5px; color: #64748B; font-family: ui-monospace, monospace; font-weight: 600;" id="slideCounter">
        Slide 1 of 23
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn" onclick="prevSlide()" title="Previous Slide [←]">◀ Prev</button>
        <button class="btn active" onclick="nextSlide()" title="Next Slide [→]">Next ▶</button>
      </div>
    </div>

    <!-- Collapsible Speaker Drawer -->
    <div id="speakerDrawer" class="speaker-drawer">
      <div class="notes-tabs">
        <span class="note-tab active" id="tabEN" onclick="setNoteTab('en')">English Script</span>
        <span class="note-tab" id="tabVI" onclick="setNoteTab('vi')">Tiếng Việt</span>
        <span class="note-tab" id="tabBoth" onclick="setNoteTab('both')">Both (Song ngữ)</span>
      </div>
      <div id="notesContent"></div>
    </div>
  </footer>

  <script>
    const slides = __SLIDES_DATA_PLACEHOLDER__;
    let currentIdx = 0;
    let timerSeconds = 0;
    let timerRunning = true;
    let timerInterval = null;
    let currentNoteTab = 'en';

    // Initialize Dropdown
    const select = document.getElementById('slideSelect');
    slides.forEach((s, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = `${s.num}. ${s.title}`;
      select.appendChild(opt);
    });

    function renderSlide(idx) {
      currentIdx = idx;
      const s = slides[currentIdx];
      select.value = currentIdx;

      document.getElementById('slideCounter').textContent = `Slide ${s.num} of ${slides.length} (${s.section})`;

      const stage = document.getElementById('slideStage');
      stage.innerHTML = `
        <div class="slide-meta">
          <span class="sec-tag">${s.section}</span>
          ${s.badge ? `<span class="badge-tag">${s.badge}</span>` : ''}
        </div>
        <div class="slide-title">${s.title}</div>
        <div class="slide-sub">${s.subtitle}</div>
        <div class="slide-visual-stage">
          ${s.visual_html}
        </div>
        <div class="key-points-grid">
          ${s.key_points.map(pt => `<div class="point-card">${pt}</div>`).join('')}
        </div>
      `;

      updateNotesContent();

      if (window.renderMathInElement) {
        renderMathInElement(stage, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ]
        });
      }
    }

    function updateNotesContent() {
      const s = slides[currentIdx];
      const container = document.getElementById('notesContent');
      if (currentNoteTab === 'en') {
        container.innerHTML = `<div style="color: #0369A1;"><strong>EN:</strong> ${s.script_en}</div>`;
      } else if (currentNoteTab === 'vi') {
        container.innerHTML = `<div style="color: #0F766E;"><strong>VI:</strong> ${s.script_vi}</div>`;
      } else {
        container.innerHTML = `
          <div style="color: #0369A1; margin-bottom: 6px;"><strong>EN:</strong> ${s.script_en}</div>
          <div style="color: #0F766E;"><strong>VI:</strong> ${s.script_vi}</div>
        `;
      }
    }

    function setNoteTab(tab) {
      currentNoteTab = tab;
      document.getElementById('tabEN').classList.toggle('active', tab === 'en');
      document.getElementById('tabVI').classList.toggle('active', tab === 'vi');
      document.getElementById('tabBoth').classList.toggle('active', tab === 'both');
      updateNotesContent();
    }

    function toggleNotes() {
      const drawer = document.getElementById('speakerDrawer');
      const btn = document.getElementById('notesBtn');
      drawer.classList.toggle('visible');
      btn.classList.toggle('active');
    }

    function toggleLanguage() {
      const btn = document.getElementById('langBtn');
      if (currentNoteTab === 'en') {
        setNoteTab('vi');
        btn.textContent = '🌐 VI';
      } else if (currentNoteTab === 'vi') {
        setNoteTab('both');
        btn.textContent = '🌐 BOTH';
      } else {
        setNoteTab('en');
        btn.textContent = '🌐 EN';
      }
    }

    function nextSlide() {
      if (currentIdx < slides.length - 1) {
        renderSlide(currentIdx + 1);
      }
    }

    function prevSlide() {
      if (currentIdx > 0) {
        renderSlide(currentIdx - 1);
      }
    }

    function jumpToSlide(idx) {
      renderSlide(parseInt(idx, 10));
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }

    // 15-Minute Countdown Timer
    function startTimer() {
      timerInterval = setInterval(() => {
        if (timerRunning) {
          timerSeconds++;
          const mins = Math.floor(timerSeconds / 60);
          const secs = timerSeconds % 60;
          const display = document.getElementById('timerDisplay');
          display.textContent = `⏱️ ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')} / 15:00`;

          if (timerSeconds >= 14 * 60) {
            display.className = 'timer-badge danger';
          } else if (timerSeconds >= 12 * 60) {
            display.className = 'timer-badge warning';
          } else {
            display.className = 'timer-badge';
          }
        }
      }, 1000);
    }

    function toggleTimer() {
      timerRunning = !timerRunning;
    }

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key.toLowerCase() === 's') {
        toggleNotes();
      } else if (e.key.toLowerCase() === 'l') {
        toggleLanguage();
      } else if (e.key.toLowerCase() === 't') {
        toggleTimer();
      } else if (e.key.toLowerCase() === 'f') {
        toggleFullscreen();
      }
    });

    // Boot
    renderSlide(0);
    startTimer();
  </script>
</body>
</html>
